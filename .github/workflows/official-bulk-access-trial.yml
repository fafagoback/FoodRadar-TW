name: FRT official-menu and bulk-feed access trial
run-name: FRT single-store official and retailer feed access trial
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/official-bulk-access-trial.yml'
permissions:
  contents: read
jobs:
  access:
    name: Test Uber Get Menu and retailer catalog access without scraping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Try read-only official sources with at most one GET each
        env:
          FRT_UBER_EATS_MENU_ACCESS_TOKEN: ${{ secrets.FRT_UBER_EATS_MENU_ACCESS_TOKEN }}
          FRT_RETAILER_BULK_CATALOG_URL: ${{ secrets.FRT_RETAILER_BULK_CATALOG_URL }}
          FRT_RETAILER_BULK_CATALOG_TOKEN: ${{ secrets.FRT_RETAILER_BULK_CATALOG_TOKEN }}
        run: python -u frt/official_bulk_access_trial.py
      - name: Publish access trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frt-official-bulk-access-trial
          path: |
            frt-official-bulk-access-trial.json
            frt-official-bulk-access-summary.md
          if-no-files-found: warn
          retention-days: 14
