name: FRT UE unfiltered catalog pagination continuation
run-name: FRT UE 3-page no-category pagination sample
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/ue-unfiltered-pagination-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    name: Three UE requests max to validate unique products across pages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3'
      - name: Bounded native catalog continuation check
        run: python -u frt/ue_unfiltered_pagination_probe.py
      - name: Publish summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frt-ue-unfiltered-pagination
          path: frt-unfiltered-catalog-pagination.json
          if-no-files-found: warn
          retention-days: 7
