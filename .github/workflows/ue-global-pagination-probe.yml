name: FRT UE global catalog pagination enabled probe
run-name: FRT UE global catalog pagination enabled (3 pages max)
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/ue-global-pagination-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    name: One PX Mart, three UE native catalog requests maximum
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3'
      - run: python -u frt/ue_global_pagination_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frt-ue-global-pagination
          path: frt-global-catalog-pagination.json
          if-no-files-found: warn
          retention-days: 7
