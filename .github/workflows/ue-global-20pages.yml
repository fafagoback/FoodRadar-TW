name: FRT UE global catalog 20-page bounded sample
run-name: FRT UE no-category global 20-page sample
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/ue-global-20pages.yml'
permissions:
  contents: read
jobs:
  probe:
    name: One grocery store, 20 requests max, no retry
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3'
      - run: python -u frt/ue_global_20pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frt-ue-global-20pages
          path: frt-global-catalog-20pages.json
          if-no-files-found: warn
          retention-days: 7
