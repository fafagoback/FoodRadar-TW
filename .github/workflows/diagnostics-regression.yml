name: Temporary FRT API diagnostics and core regression
on:
  push:
    branches: [fix/sync-fr-api-diagnostics-20261127]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python frt/bootstrap.py
      - run: pip install -r requirements.txt
      - name: Audit prior compact DB contract compatibility
        run: |
          python - <<'PY'
          import hashlib, json, shutil, subprocess, tempfile
          from pathlib import Path
          from state_checkpoint import DIRECT_LAYOUT_CONTRACTS, direct_contract_digest, retention_predecessor
          root=Path.cwd()
          cfg=json.loads((root/"config.json").read_text())
          is_frt="Foodradar-TW" in cfg.get("hf_repo_id","")
          old_source=None
          with tempfile.TemporaryDirectory() as temp:
              workspace=Path(temp)
              if is_frt:
                  old_source=workspace/"fr-source"
                  subprocess.run(["git","init","-q",str(old_source)],check=True)
                  subprocess.run(["git","-C",str(old_source),"fetch","-q","--depth=1",
                                  "https://github.com/fafagoback/FoodRadar.git","5a1c712de149f7a830dd0d2c6bcec37e2dd5b70d"],check=True)
              for name in DIRECT_LAYOUT_CONTRACTS:
                  output=workspace/name
                  output.parent.mkdir(parents=True,exist_ok=True)
                  source=(root/name).read_bytes()
                  if name in ("src/raw_capture.py","src/catalog_complete.py"):
                      if is_frt:
                          source=subprocess.check_output(["git","-C",str(old_source),"show",f"FETCH_HEAD:{name}"])
                          if name=="src/raw_capture.py":
                              source=source.replace(b"hub-google/FoodRadar",cfg["hf_repo_id"].encode())
                      else:
                          source=subprocess.check_output(["git","show",f"5a1c712de149f7a830dd0d2c6bcec37e2dd5b70d:{name}"])
                  output.write_bytes(source)
              shutil.copy2(root/"config.json",workspace/"config.json")
              print("FOODRADAR_CAPTURE_CONTRACT_AUDIT="+json.dumps({
                  "current":direct_contract_digest(root),
                  "prior_capture":direct_contract_digest(workspace),
                  "prior_retention":retention_predecessor(workspace),
                  "repo":cfg["hf_repo_id"]
              }),flush=True)
          PY
      - run: python -m unittest discover -s frt/tests -v
      - run: python -m unittest discover -s tests -p 'test_parallel_worker_slots.py' -v
      - run: python -m unittest discover -s tests -p 'test_batch_crawl.py' -v
      - run: python -m unittest discover -s tests -p 'test_catalog_complete.py' -v
      - run: python -m unittest discover -s tests -p 'test_adaptive_threads.py' -v
      - run: python -m unittest discover -s tests -p 'test_sb_task_pool_transport.py' -v
      - run: python -m unittest discover -s frt -p 'test_adapter.py' -v
      - run: pip install pyyaml
      - run: python -m unittest discover -s frt -p 'test_workflow_parity.py' -v
      - run: python -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path("config.json").read_text())
          assert c["hf_repo_id"]=="hub-google/Foodradar-TW"
          assert c["hf_raw_retention_days"]==60
          assert "/functions/v1/frt-task-pool" in Path("src/sb_task_pool.py").read_text()
          assert "foodradar-tw:task-pool" in Path("src/sb_task_pool.py").read_text()
          assert Path("fr-core-revision.txt").read_text().strip()=="b7d01c9933eef2ca7fcd02ba907ac48fce71ad72"
          print("FRT SHARED CORE CONTRACT PASSED")
          PY
