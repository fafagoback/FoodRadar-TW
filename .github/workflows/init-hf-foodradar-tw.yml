name: FRT one-time HF dataset initialization
on:
  push:
    branches: [maintenance/init-hf-foodradar-tw]
    paths: [.github/workflows/init-hf-foodradar-tw.yml]
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - name: Create independent dataset without touching existing data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          target = "hub-google/Foodradar-TW"
          api.create_repo(target, repo_type="dataset", private=True, exist_ok=True)
          info = api.repo_info(target, repo_type="dataset")
          print("Verified dataset:", info.id, "private:", info.private)
          PY
