name: FRT bounded live full grocery menu trial
run-name: FRT LIVE 大全聯鳳山店完整菜單 390次上限驗證
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/live-full-grocery-trial.yml'
permissions:
  contents: read
jobs:
  single-store:
    name: One store only, max 390 UE requests, min 1.5sec/request, no retries on rejection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements and checkout pinned production menu parser
        run: |
          pip install 'requests>=2.32,<3'
          python frt/bootstrap.py
      - name: Run controlled full menu single grocery trial
        env:
          PYTHONPATH: src
        run: python -u frt/live_single_large_grocery.py
      - name: Save actual full UE menu and evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frt-live-single-grocery-full-menu-report
          path: |
            frt-live-one-store-report.json
            frt-live-px-fengshan-full-menu.json.gz
          if-no-files-found: warn
          retention-days: 7
