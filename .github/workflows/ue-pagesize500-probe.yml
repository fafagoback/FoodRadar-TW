name: FRT UE 500 items per page experiment
run-name: FRT UE global catalog pageSize 500 single request
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/ue-pagesize500-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    name: One UE call only page size 500
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3'
      - run: python -u frt/ue_pagesize500_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frt-ue-pagesize500
          path: frt-ue-pagesize500.json
          if-no-files-found: warn
          retention-days: 7
