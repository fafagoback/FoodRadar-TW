name: FRT full grocery production menu replay validation
run-name: FRT full PX grocery 16k items actual price/promo replay
on:
  push:
    branches: [audit-frt-raw-20261126]
    paths:
      - '.github/workflows/full-grocery-production-replay.yml'
permissions:
  contents: read
jobs:
  trial:
    name: Validate full UE grocery final FRT menus from immutable HF Raw (no UE access)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only HF and pinned FR runtime dependencies
        run: pip install 'huggingface_hub>=0.34,<2' hf_xet 'requests>=2.32,<3'
      - name: Bootstrap exactly pinned FR production menu code
        run: python frt/bootstrap.py
      - name: Download existing UE full archive from HF (read-only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: '600'
          HF_XET_HIGH_PERFORMANCE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(repo_id="hub-google/Foodradar-TW",
                              filename="Raw/20261126072649/capture.tar.gz",
                              repo_type="dataset", token=os.environ["HF_TOKEN"],
                              cache_dir=os.path.join(os.environ["RUNNER_TEMP"],"frt-grocery-replay-hf"))
          if Path(p).stat().st_size < 6000000000:
              raise RuntimeError("Incomplete original HF archive")
          Path("frt-hf-existing-archive-path.txt").write_text(p,encoding="utf8")
          print("FRT_REPLAY_ARCHIVE_BYTES="+str(Path(p).stat().st_size),flush=True)
          PY
      - name: Real production ETL replay of complete PX grocery and optimized subset
        env:
          PYTHONPATH: src
        run: |
          python -u frt/full_grocery_production_replay.py "$(cat frt-hf-existing-archive-path.txt)"
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frt-full-grocery-production-replay-20261126
          path: frt-grocery-production-replay.json
          if-no-files-found: warn
          retention-days: 14
