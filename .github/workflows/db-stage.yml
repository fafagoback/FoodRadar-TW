name: FRT 04｜DB 第二階段工作池（離線）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/db-stage.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify=離線測試；run=以既有爬蟲 Artifact 更新 DB'
        type: choice
        options: [verify, validate, run]
        default: verify
      source_run_id:
        description: '來源爬蟲 Action Run ID'
        type: string
      batch_id:
        description: 'HF Raw 14 碼批次'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: frt-db-stage
  cancel-in-progress: false
jobs:
  verify:
    name: 離線語法與工作池測試（無 UE API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python -m compileall -q src/db_task_pool.py scripts/db_stage_plan.py scripts/db_stage_worker.py scripts/db_stage_merge.py
          python -m unittest discover -s tests -p test_db_task_pool.py -v
          python -m unittest discover -s tests -p test_db_stage_integration.py -v
          python -m unittest discover -s frt -p test_adapter.py -v
  smoke:
    name: 既有 FRT 原始 Artifact 真實商品解碼（不發 UE API）
    needs: verify
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[db-smoke]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 實際下載先前工作機 Artifact 並解碼一間店
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u scripts/db_stage_smoke.py \
            --source-run-id 45886126553 \
            --batch-id 20261126072649 \
            --source-sha 3fd98536e4807db85acf473cd9d773f177d528a4
  db_00:
    name: DB 00｜依既有爬蟲結果建立專用 Supabase 工作池
    needs: verify
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'run' || inputs.mode == 'validate')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[db-plan-smoke]') || contains(github.event.head_commit.message, '[db-full-verify]'))) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 以 Supabase 游標分批建池（不重新下載原始資料或呼叫 UE）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/db_stage_plan.py --source-run-id "${{ inputs.source_run_id || '45886126553' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: db-stage-plan
          path: data/db-stage-plan.json
          if-no-files-found: error
  db_workers:
    name: DB ${{ matrix.worker }}｜動態領下一家店
    needs: db_00
    if: ${{ needs.db_00.result == 'success' && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'run' || inputs.mode == 'validate')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[db-full-verify]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        worker: ['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15']
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: db-stage-plan
          path: data/
      - name: 讀取既有 Artifact、驗證雜湊、解析商品
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DONE_FILE="data/db-worker-${{ matrix.worker }}.done"
          nohup python -u scripts/db_stage_worker.py heartbeat \
            --index "${{ matrix.worker }}" --done-file "$DONE_FILE" > db-stage-heartbeat.log 2>&1 < /dev/null &
          python -u scripts/db_stage_worker.py worker --index "${{ matrix.worker }}" \
            --source-run-id "${{ inputs.source_run_id || '45886126553' }}" --batch-id "${{ inputs.batch_id || '20261126072649' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: db-worker-${{ github.run_id }}-${{ matrix.worker }}
          path: data/db-worker-${{ matrix.worker }}/
          if-no-files-found: error
          compression-level: 1
          retention-days: 5
      - name: 儲存成功才完成任務
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/db_stage_worker.py finalize --index "${{ matrix.worker }}"
      - name: 停止上傳期間的租約續約
        if: always()
        run: |
          touch "data/db-worker-${{ matrix.worker }}.done"
          if test -f db-stage-heartbeat.log; then tail -20 db-stage-heartbeat.log; fi
  hf_16:
    name: HF 16｜獨立確認既有 Raw 檔案
    needs: db_00
    if: ${{ needs.db_00.result == 'success' && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'run' || inputs.mode == 'validate')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[db-full-verify]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'huggingface_hub>=0.30,<2'
      - name: 只確認 HF 已上傳資料，絕不重新爬取
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BATCH_ID: ${{ inputs.batch_id || '20261126072649' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          cfg=json.loads(Path('config.json').read_text())
          batch=os.environ['BATCH_ID']
          if len(batch)!=14 or not batch.isdecimal():raise SystemExit('Invalid batch ID')
          repo=cfg['hf_repo_id'];folder=cfg['hf_folder'].strip('/')
          meta=json.loads(Path(hf_hub_download(repo,f'{folder}/{batch}/manifest.json',
            repo_type='dataset',token=os.environ['HF_TOKEN'])).read_text())
          files=HfApi(token=os.environ['HF_TOKEN']).get_paths_info(
            repo,[meta['archive_path']],repo_type='dataset',expand=True)
          if meta['batch_id']!=batch or len(files)!=1:raise SystemExit('Raw batch absent')
          lfs=getattr(files[0],'lfs',None)
          sha=lfs.get('sha256') if isinstance(lfs,dict) else getattr(lfs,'sha256',None)
          if sha and sha!=meta['archive_sha256']:raise SystemExit('Raw SHA mismatch')
          print('HF_RAW_AVAILABLE',batch,files[0].size)
          PY
  db_recovery_plan:
    name: DB 故障接手｜只重新分配尚未持久化的店家
    needs: [db_00, db_workers]
    if: ${{ always() && !cancelled() && needs.db_00.result == 'success' && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'run' || inputs.mode == 'validate')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[db-full-verify]'))) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3'
      - name: 所有初次工作機停止後才重領未完成工作
        id: plan
        run: |
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,'src')
          from db_task_pool import DBTaskPool
          pool=DBTaskPool()
          before=pool.status()
          unfinished=sum(int(v) for k,v in before.items() if k not in ('completed','failed'))
          released=pool.requeue() if unfinished else {'requeued':0}
          after=pool.status()
          remaining=sum(int(v) for k,v in after.items() if k not in ('completed','failed'))
          print('FOODRADAR_DB_RECOVERY='+json.dumps({
            'before':before,'after':after,'released':released}),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('pending='+str(remaining>0).lower()+'\n')
          PY

  db_recovery_workers:
    name: DB 接手 ${{ matrix.worker }}｜補領未完成店家
    needs: [db_00, db_recovery_plan]
    if: ${{ needs.db_recovery_plan.result == 'success' && needs.db_recovery_plan.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        worker: ['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15']
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: db-stage-plan
          path: data/
      - name: 接手原工作池剩餘店家（不呼叫 UE）
        env:
          GH_TOKEN: ${{ github.token }}
          FR_DB_WAVE: '1'
        run: |
          DONE_FILE="data/db-worker-${{ matrix.worker }}.done"
          nohup python -u scripts/db_stage_worker.py heartbeat \
            --index "${{ matrix.worker }}" --done-file "$DONE_FILE" > db-stage-heartbeat.log 2>&1 < /dev/null &
          python -u scripts/db_stage_worker.py worker --index "${{ matrix.worker }}" \
            --source-run-id "${{ inputs.source_run_id || '45886126553' }}" --batch-id "${{ inputs.batch_id || '20261126072649' }}"
      - name: 上傳故障接手成果
        uses: actions/upload-artifact@v4
        with:
          name: db-worker-${{ github.run_id }}-${{ matrix.worker }}-w01
          path: data/db-worker-${{ matrix.worker }}/
          if-no-files-found: error
          compression-level: 1
          retention-days: 5
      - name: 確認已持久保存的接手任務
        run: python scripts/db_stage_worker.py finalize --index "${{ matrix.worker }}"
      - name: 停止接手工作機租約續約
        if: always()
        run: |
          touch "data/db-worker-${{ matrix.worker }}.done"
          if test -f db-stage-heartbeat.log; then tail -20 db-stage-heartbeat.log; fi

  db_gate:
    name: DB 工作池｜核對全部店家完成或符合 5% 失敗率
    needs: [db_00, db_workers, db_recovery_plan, db_recovery_workers, hf_16]
    if: ${{ always() && !cancelled() && needs.db_00.result == 'success' && needs.db_recovery_plan.result == 'success' && needs.hf_16.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3'
      - uses: actions/download-artifact@v4
        with:
          name: db-stage-plan
          path: data/
      - name: 確認任務全數有結果，即使個別工作機曾故障仍可接手
        run: |
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'src')
          from db_task_pool import DBTaskPool
          plan=json.loads(Path('data/db-stage-plan.json').read_text())
          status=DBTaskPool().status()
          expected=plan['stores']
          done=int(status.get('completed',0))
          failed=int(status.get('failed',0))
          pending=sum(int(v) for k,v in status.items() if k not in ('completed','failed'))
          print('FOODRADAR_DB_GATE='+json.dumps({
            'expected':expected,'completed':done,'failed':failed,'outstanding':pending}),flush=True)
          if pending or done+failed!=expected:
            raise SystemExit('Unfinished or duplicated DB task; previous verified version preserved')
          if failed*20>expected:
            raise SystemExit('Store failure rate over 5 percent')
          PY
  db_17:
    name: DB 17｜核對完成結果與增量 DB
    needs: [db_gate]
    if: ${{ needs.db_gate.result == 'success' }}
    concurrency:
      group: foodradar-database-publisher
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: db-stage-plan
          path: data/
      - name: 取得本輪 15 台運算成果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/db-artifacts
          gh run download "${{ github.run_id }}" --pattern "db-worker-${{ github.run_id }}-*" --dir data/db-artifacts
      - name: 讀取 HF 上一版持久 DB
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/hf_retention.py restore
      - name: 嚴格核對歷史價格後寫 DB
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.mode }}" == "validate" ]]; then
            python -u scripts/db_stage_merge.py --source-run-id "${{ inputs.source_run_id || '45886126553' }}" \
              --batch-id "${{ inputs.batch_id || '20261126072649' }}" --verify-only
          else
            python -u scripts/db_stage_merge.py --source-run-id "${{ inputs.source_run_id }}" \
              --batch-id "${{ inputs.batch_id }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: db-stage-verified-checkpoint
          path: |
            data/state-checkpoint/
            data/db-stage-checkpoint/
          if-no-files-found: error
          retention-days: 5

  web_build:
    name: 第三階段｜從已持久化 DB 建置網站資料
    needs: db_17
    if: ${{ needs.db_17.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode == 'run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 從 HF 恢復剛剛保存的精簡 DB（不重新處理原始菜單）
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/hf_retention.py restore
      - name: 僅使用完整檢查點建置網站
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FOODRADAR_REQUIRE_COMPLETE_CHECKPOINT: '1'
        run: |
          python -u scripts/prepare_hf_release.py
          test "$(cat data/latest.txt)" = "${{ inputs.batch_id }}"
          mkdir -p pages-static-source
          cp -a "data/${{ inputs.batch_id }}/static-public/." pages-static-source/
          test -s pages-static-source/current.json
          test -d pages-static-source/blobs
      - name: 保存已驗證靜態資料為 Pages 來源 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-static-source
          path: pages-static-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: 交給 FRT 02 正式部署並核對線上資料批次
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f source_run_id="$GITHUB_RUN_ID" -f source_sha="$GITHUB_SHA"

  plan_smoke_cleanup:
    name: 測試完成後清空 DB 專用池（不影響爬蟲）
    needs: db_00
    if: ${{ always() && needs.db_00.result == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[db-plan-smoke]') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3'
      - name: 驗證工作池數量並清空測試任務
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'src')
          from db_task_pool import DBTaskPool
          pool=DBTaskPool()
          state=pool.status()
          print('FRT_DB_POOL_REAL_SEED_TEST=',state,flush=True)
          if int(state.get('pending',0))!=50741:raise SystemExit('Not all stores seeded')
          print('FRT_DB_POOL_REAL_PURGE=',pool.purge(),flush=True)
          if pool.status():raise SystemExit('Test pool not cleared')
          PY

  full_verify_cleanup:
    name: 全台離線驗證結束後清理專用 DB 工作池
    needs: [db_00, db_workers, db_recovery_plan, db_recovery_workers, hf_16, db_17]
    if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[db-full-verify]') && needs.db_00.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 frt/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3'
      - name: 全部工作機停止後回收租約及測試工作池
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'src')
          from db_task_pool import DBTaskPool
          pool=DBTaskPool()
          print('FRT_DB_VERIFY_FINAL_STATUS='+json.dumps(pool.status()),flush=True)
          print('FRT_DB_VERIFY_RELEASE='+json.dumps(pool.requeue()),flush=True)
          print('FRT_DB_VERIFY_CLEANUP='+json.dumps(pool.purge()),flush=True)
          PY
